<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATS Resume Builder - HRBP Professional</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Calibri', 'Arial', sans-serif; line-height: 1.5; color: #000; background: #f8f9fa; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .header { text-align: center; margin-bottom: 40px; padding: 20px; background: linear-gradient(135deg, #2c5282 0%, #2a4365 100%); color: white; border-radius: 12px; }
        .builder-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        .form-section, .preview-section { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: #374151; }
        input, textarea, select { width: 100%; padding: 10px; border: 2px solid #e2e8f0; border-radius: 6px; font-size: 14px; }
        input:focus, textarea:focus { outline: none; border-color: #2c5282; }
        textarea { resize: vertical; min-height: 70px; font-family: inherit; }
        .section-header { background: #2c5282; color: white; padding: 12px 16px; margin: -25px -25px 20px -25px; border-radius: 8px 8px 0 0; font-weight: 600; }
        .preview-resume { font-family: 'Calibri', 'Arial', sans-serif; font-size: 11pt; line-height: 1.4; max-width: 8in; margin: 0 auto; padding: 0.75in 0.5in; }
        .resume-header { text-align: center; border-bottom: 3px solid #2c5282; padding-bottom: 20px; margin-bottom: 30px; }
        .name { font-size: 26pt; font-weight: bold; margin-bottom: 8px; }
        .job-title { font-size: 14pt; color: #2c5282; font-weight: 600; margin-bottom: 5px; }
        .contact-info { font-size: 11pt; color: #4a5568; }
        .section-title { font-size: 13pt; font-weight: bold; color: #2c5282; margin: 20px 0 12px 0; border-bottom: 2px solid #e2e8f0; padding-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .first-section-title { margin-top: 0; }
        .job-entry { margin-bottom: 20px; page-break-inside: avoid; }
        .job-title-entry { font-weight: bold; font-size: 12pt; margin-bottom: 4px; }
        .company-period { color: #2c5282; font-weight: 600; font-style: italic; margin-bottom: 8px; }
        .bullet-point { margin-left: 20px; margin-bottom: 4px; }
        .btn { background: #48bb78; color: white; padding: 12px 24px; border: none; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; width: 100%; margin-top: 12px; }
        .btn:hover { background: #38a169; }
        .btn-secondary { background: #2c5282; }
        .btn-secondary:hover { background: #2a4365; }
        .btn-sm { width: auto; padding: 6px 12px; font-size: 13px; margin-left: 10px; display: inline-block; }
        .remove-btn { background: #e53e3e; }
        .remove-btn:hover { background: #c53030; }
        .competency-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 10px; }
        .competency-item { background: #f7fafc; padding: 8px 12px; border-radius: 4px; border-left: 3px solid #2c5282; }

        @media print {
            body * { visibility: visible !important; }
            .builder-grid, .header, .btn, .form-section, .section-header, .remove-btn { display: none !important; }
            .preview-section { box-shadow: none !important; padding: 0 !important; position: absolute; left: 0; top: 0; width: 100%; }
            .preview-resume { box-shadow: none !important; padding: 0.75in 0.5in !important; margin: 0 !important; width: 100% !important; max-width: none !important; }
            * { color: black !important; background: white !important; }
            @page { margin: 0.75in !important; size: letter !important; }
        }
        @media (max-width: 768px) { .builder-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📋 ATS Resume Builder - HRBP Professional</h1>
            <p>Build ATS-friendly resumes following industry-standard HRBP structure</p>
        </div>

        <div class="builder-grid">
            <!-- FORM -->
            <div class="form-section">
                <div class="section-header">👤 Contact Information</div>
                <div class="form-group"><label>Full Name *</label><input type="text" id="name" placeholder="KARAN KUMAR"></div>
                <div class="form-group"><label>Job Title *</label><input type="text" id="jobTitle" placeholder="Manager – HR Business Partner"></div>
                <div class="form-group"><label>Phone</label><input type="tel" id="phone" placeholder="+91 9891163619"></div>
                <div class="form-group"><label>Email *</label><input type="email" id="email" placeholder="karan.raj1503@gmail.com"></div>
                <div class="form-group"><label>Location</label><input type="text" id="location" placeholder="Bangalore, India"></div>

                <div class="section-header">📝 Professional Summary</div>
                <div class="form-group"><label>Summary (3-5 lines)</label><textarea id="summary" placeholder="Dynamic and results-driven HR Business Partner with 8+ years experience..."></textarea></div>

                <div class="section-header">⭐ Core Competencies</div>
                <div class="form-group"><label>Skills (one per line)</label><textarea id="competencies" class="competency-grid" placeholder="Talent Acquisition & Onboarding&#10;Payroll Automation & Vendor Management&#10;Employee Relations & Communication&#10;HR Policy Compliance & Monitoring"></textarea></div>

                <div class="section-header">💼 Professional Experience</div>
                <div id="jobsContainer">
                    <div class="job-entry form-group">
                        <input type="text" class="job-title-input" placeholder="Manager – HRBP">
                        <input type="text" class="job-company-input" placeholder="RentoMojo, Bangalore">
                        <input type="text" class="job-period-input" placeholder="Jul 2022 – Present">
                        <textarea class="job-desc-input" placeholder="• Strategically partner with business leaders...&#10;• Manage recruitment, onboarding...&#10;• Implement HR policies..."></textarea>
                    </div>
                </div>
                <button class="btn" onclick="addJob()">➕ Add Previous Job</button>

                <div class="section-header">🎓 Education</div>
                <div id="educationContainer">
                    <div class="job-entry form-group">
                        <input type="text" class="edu-degree-input" placeholder="MBA">
                        <input type="text" class="edu-institution-input" placeholder="Kalam Institute of Technology">
                    </div>
                </div>
                <button class="btn" onclick="addEducation()">➕ Add Education</button>

                <button class="btn btn-secondary" onclick="printResume()">🖨️ Download ATS Resume (PDF)</button>
            </div>

            <!-- PREVIEW -->
            <div class="preview-section">
                <div class="section-header">👀 Live ATS Preview</div>
                <div id="resumePreview" class="preview-resume">
                    <div class="resume-header">
                        <div class="name" id="previewName">Your Name</div>
                        <div class="job-title" id="previewJobTitle">Your Job Title</div>
                        <div class="contact-info" id="previewContact">Contact Information</div>
                    </div>
                    <div id="previewContent"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function addJob() {
            const newJob = `
                <div class="job-entry form-group">
                    <input type="text" class="job-title-input" placeholder="Job Title">
                    <input type="text" class="job-company-input" placeholder="Company, Location">
                    <input type="text" class="job-period-input" placeholder="Start Date – End Date">
                    <textarea class="job-desc-input" placeholder="• Achievement 1&#10;• Achievement 2&#10;• Achievement 3"></textarea>
                    <button class="btn btn-sm remove-btn" onclick="this.parentElement.remove()">❌</button>
                </div>
            `;
            document.getElementById('jobsContainer').insertAdjacentHTML('beforeend', newJob);
        }

        function addEducation() {
            const newEdu = `
                <div class="job-entry form-group">
                    <input type="text" class="edu-degree-input" placeholder="Degree">
                    <input type="text" class="edu-institution-input" placeholder="Institution">
                    <button class="btn btn-sm remove-btn" onclick="this.parentElement.remove()">❌</button>
                </div>
            `;
            document.getElementById('educationContainer').insertAdjacentHTML('beforeend', newEdu);
        }

        function generateResume() {
            const name = document.getElementById('name').value || 'Your Name';
            const jobTitle = document.getElementById('jobTitle').value || 'Professional';
            const phone = document.getElementById('phone').value || '';
            const email = document.getElementById('email').value || '';
            const location = document.getElementById('location').value || '';
            
            document.getElementById('previewName').textContent = name;
            document.getElementById('previewJobTitle').textContent = jobTitle;
            document.getElementById('previewContact').textContent = [location, phone, email].filter(Boolean).join(' | ');

            let content = '';
            
            // Summary
            const summary = document.getElementById('summary').value;
            if (summary) {
                content += `<div class="resume-section first-section-title">
                    <div class="section-title">PROFESSIONAL SUMMARY</div>
                    <div>${summary.replace(/\n/g, '<br>')}</div>
                </div>`;
            }

            // Competencies
            const competencies = document.getElementById('competencies').value;
            if (competencies) {
                content += `<div class="resume-section">
                    <div class="section-title">CORE COMPETENCIES</div>
                    <div class="competency-grid">${competencies.split('\n').filter(c => c.trim()).map(c => `<div class="competency-item">${c.trim()}</div>`).join('')}</div>
                </div>`;
            }

            // Jobs
            let jobsHtml = '';
            document.querySelectorAll('#jobsContainer .job-entry').forEach(job => {
                const title = job.querySelector('.job-title-input').value;
                const company = job.querySelector('.job-company-input').value;
                const period = job.querySelector('.job-period-input').value;
                const desc = job.querySelector('.job-desc-input').value;
                
                if (title || company) {
                    jobsHtml += `
                        <div class="job-entry">
                            <div class="job-title-entry">${title}</div>
                            <div class="company-period">${company} | ${period}</div>
                            ${desc ? `<div>${desc.replace(/\n/g, '<br>')}</div>` : ''}
                        </div>
                    `;
                }
            });

            if (jobsHtml) {
                content += `<div class="resume-section">
                    <div class="section-title">PROFESSIONAL EXPERIENCE</div>
                    ${jobsHtml}
                </div>`;
            }

            // Education
            let eduHtml = '';
            document.querySelectorAll('#educationContainer .job-entry').forEach(edu => {
                const degree = edu.querySelector('.edu-degree-input').value;
                const institution = edu.querySelector('.edu-institution-input').value;
                if (degree || institution) {
                    eduHtml += `<div>• ${degree} – ${institution}</div>`;
                }
            });

            if (eduHtml) {
                content += `<div class="resume-section">
                    <div class="section-title">EDUCATION</div>
                    ${eduHtml}
                </div>`;
            }

            document.getElementById('previewContent').innerHTML = content;
        }

        function printResume() {
            if (!document.getElementById('name').value || !document.getElementById('email').value) {
                alert('Please fill Name and Email first!');
                return;
            }
            generateResume();
            window.print();
        }

        document.addEventListener('input', generateResume);
        generateResume();
    </script>
</body>
</html>
